# LootDrop Plugin Configuration
# Configure your loot drop events here

loot-drop:
  # Maximum health of the loot drop entity
  max-health: 500.0
  
  # Display name of the loot drop (supports color codes with &)
  display-name: "&6&lLOOT DROP"
  
  # Height of the particle beam effect (in blocks)
  particle-height: 50

  # Changes the sound when you hit the lootdrop
  use-custom-hit-sound: true
  
  # Items that will drop when the loot drop is destroyed
  items:
    item1:
      material: DIAMOND
      amount: 5
      chance: 100.0  # 100% chance to drop
    
    item2:
      material: GOLD_INGOT
      amount: 10
      chance: 100.0
    
    item3:
      material: EMERALD
      amount: 3
      chance: 80.0  # 80% chance to drop
    
    item4:
      material: ENCHANTED_GOLDEN_APPLE
      amount: 1
      chance: 50.0  # 50% chance to drop
    
    item5:
      material: NETHERITE_INGOT
      amount: 2
      chance: 30.0  # 30% chance to drop
    
    item6:
      material: DIAMOND_SWORD
      amount: 1
      chance: 25.0
    
    item7:
      material: DIAMOND_PICKAXE
      amount: 1
      chance: 25.0
    
    item8:
      material: EXPERIENCE_BOTTLE
      amount: 32
      chance: 100.0

# Add more items as needed following the same format
# Available materials: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html