name: LootDrop
version: 1.1.0
main: com.starmaster.lootdrop.LootDropPlugin
api-version: 1.21
author: StarMaster
description: Allows admins to spawn loot drop events with customizable entities

commands:
  lootdrop:
    description: Main loot drop command
    usage: /lootdrop <spawn|reload|list|auto>
    aliases: [ld, lootdrops]
    permission: lootdrop.admin

permissions:
  lootdrop.admin:
    description: Allows access to all loot drop commands
    default: op
